<div class="navbar">

  <!-- Left -->
  <div class="logo" (click)="router.navigate(['/'])">
    💍 Vivah
  </div>

  <!-- Right -->
  <div class="nav-right">

    <!-- Not Logged In -->
    @if (!(isLoggedIn$ | async)) {
      <button class="login-btn" (click)="openLogin()">Login</button>
    } @else {
      <div class="profile" (click)="toggleDropdown($event)">

        <div class="avatar">👤</div>

        <div class="dropdown" *ngIf="isDropdownOpen">

          <div class="item" (click)="goToProfile()">My Profile</div>

          <!-- USER role: bookings -->
          <div class="item" (click)="goToBookings()">My Bookings</div>

          <!-- OWNER role: owner dashboard -->
          @if ((role$ | async) === 'OWNER') {
            <div class="item" (click)="goToOwnerDashboard()">Owner Dashboard</div>
          }

          <!-- AGENT role: agent + owner dashboards -->
          @if ((role$ | async) === 'AGENT') {
            <div class="item" (click)="goToOwnerDashboard()">Owner Dashboard</div>
            <div class="item" (click)="goToAgentDashboard()">Agent Dashboard</div>
          }

          <!-- ADMIN role: all dashboards -->
          @if ((role$ | async) === 'ADMIN') {
            <div class="item" (click)="goToOwnerDashboard()">Owner Dashboard</div>
            <div class="item" (click)="goToAgentDashboard()">Agent Dashboard</div>
            <div class="item" (click)="goToAdminDashboard()">Admin Dashboard</div>
          }

          <div class="divider"></div>
          <div class="item logout" (click)="logout()">Logout</div>

        </div>
      </div>
    }

  </div>

</div>
