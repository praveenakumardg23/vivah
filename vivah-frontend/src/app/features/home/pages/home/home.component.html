<div class="home">

  <!-- Hero Section -->
  <div class="hero">
    <h1>Find Your Perfect Wedding Hall 💍</h1>
    <p>Book mantapas easily across your city</p>
  </div>

  <!-- Search Box -->
  <div class="search-box">
    <select [(ngModel)]="selectedLocation">
      <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
    </select>

    <input type="date" [min]="today" [(ngModel)]="selectedDate" />

    <button (click)="search()">🔍 Search</button>
  </div>

  <!-- Categories -->
  <div class="categories">
    <div class="category">🏛️ Large Halls</div>
    <div class="category">💒 Small Venues</div>
    <div class="category">🌳 Outdoor</div>
  </div>

  <!-- Featured Halls -->
  <div class="featured">
    <h2>Available Venues</h2>

    <!-- Loading -->
    <div class="loader-wrap" *ngIf="isLoading">
      <div class="loader"></div>
    </div>

    <!-- No Results -->
    <div class="empty-results" *ngIf="!isLoading && featuredHalls.length === 0">
      <span>🏛️</span>
      <p>No halls found. Try a different city or date.</p>
    </div>

    <!-- Hall Grid -->
    <div class="hall-grid" *ngIf="!isLoading">
      <app-hall-card
        *ngFor="let hall of featuredHalls"
        [hall]="hall">
      </app-hall-card>
    </div>
  </div>

</div>
