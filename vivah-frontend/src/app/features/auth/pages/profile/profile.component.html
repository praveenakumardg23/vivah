<div class="profile-container">

  <!-- Header -->
  <div class="profile-header">
    <div class="avatar-circle">{{ (name || phone || '?')[0].toUpperCase() }}</div>
    <div class="header-text">
      <h2>My Profile</h2>
      <span class="role-badge">{{ roleLabel }}</span>
    </div>
    <!-- Close button when opened as dialog -->
    <button class="close-btn" *ngIf="isInDialog" (click)="closeDialog()">✕</button>
  </div>

  <!-- Alert -->
  @if (message) {
    <div class="alert" [class.alert-success]="messageType === 'success'" [class.alert-error]="messageType === 'error'">
      {{ message }}
    </div>
  }

  <!-- Name -->
  <div class="form-group">
    <label>Full Name</label>
    <input type="text" [(ngModel)]="name" placeholder="Enter your name" />
  </div>

  <!-- Phone (read-only) -->
  <div class="form-group">
    <label>Mobile Number</label>
    <div class="readonly-field">
      <span>{{ phone }}</span>
      <span class="verified-chip">✓ Verified</span>
    </div>
  </div>

  <!-- Email -->
  <div class="form-group">
    <label>Email Address</label>
    <div class="email-row">
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        [disabled]="isEmailVerified" />
      @if (isEmailVerified) {
        <span class="verified-chip">✓ Verified</span>
      } @else if (email) {
        <button class="btn-verify-email" (click)="sendEmailOtp()" [disabled]="isSendingOtp">
          {{ isSendingOtp ? 'Sending...' : 'Verify' }}
        </button>
      }
    </div>
  </div>

  <!-- Email OTP input -->
  @if (showOtpInput) {
    <div class="form-group otp-group">
      <label>Enter Email OTP</label>
      <div class="otp-row">
        <input type="text" [(ngModel)]="emailOtp" placeholder="6-digit OTP" maxlength="6" />
        <button class="btn-confirm-otp" (click)="verifyEmailOtp()" [disabled]="isVerifyingOtp">
          {{ isVerifyingOtp ? '...' : 'Confirm' }}
        </button>
      </div>
      <p class="otp-hint">Check your inbox at {{ email }}</p>
    </div>
  }

  <!-- Save -->
  <button class="btn-primary" (click)="updateProfile()" [disabled]="isLoading">
    {{ isLoading ? 'Saving...' : 'Save Changes' }}
  </button>

</div>
